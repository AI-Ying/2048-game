<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 动物版 · v1.0.1</title>
<style>
  :root {
    --bg-page: #faf8ef;
    --bg-board: #bbada0;
    --text-primary: #776e65;
    --text-light: #f9f6f2;
    --cell-empty: #cdc1b4;
    --tile-grid-gap: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-page);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 12px 40px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  .container { width: 100%; max-width: 480px; }

  /* ===== 顶部 ===== */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .title { font-size: 46px; font-weight: 700; color: #776e65; letter-spacing: 1px; }

  .scores {
    display: flex;
    gap: 8px;
  }
  .score-box {
    background: #bbada0;
    color: #eee4da;
    border-radius: 6px;
    padding: 6px 12px;
    text-align: center;
    min-width: 70px;
  }
  .score-box small {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #eee4da;
    opacity: .8;
    margin-bottom: 2px;
  }
  .score-box span {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  .subhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
    color: #776e65;
  }
  .subhead .hint { font-size: 13px; opacity: .85; }

  .btn {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #7d6a57; }

  /* ===== 棋盘 ===== */
  .board-wrap { position: relative; margin-top: 6px; }

  .board {
    background: var(--bg-board);
    border-radius: 8px;
    padding: var(--tile-grid-gap);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--tile-grid-gap);
    aspect-ratio: 1 / 1;
  }

  .cell {
    background: var(--cell-empty);
    border-radius: 6px;
  }

  /* ===== 覆盖层 ===== */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.85);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 34px; color: #776e65; }
  .overlay p { font-size: 16px; color: #776e65; }

  /* ===== 动态生成的数字块 ===== */
  .tile {
    position: absolute;
    width: calc((100% - 3 * var(--tile-grid-gap)) / 4);
    height: calc((100% - 3 * var(--tile-grid-gap)) / 4);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #776e65;
    transition: transform .12s ease-in-out;
    will-change: transform;
  }

  .tile-2   { background: #eee4da; color: #776e65; font-size: 42px; }
  .tile-4   { background: #ede0c8; color: #776e65; font-size: 42px; }
  .tile-8   { background: #f2b179; color: #f9f6f2; font-size: 42px; }
  .tile-16  { background: #f59563; color: #f9f6f2; font-size: 36px; }
  .tile-32  { background: #f67c5f; color: #f9f6f2; font-size: 36px; }
  .tile-64  { background: #f65e3b; color: #f9f6f2; font-size: 36px; }
  .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 30px; }
  .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 30px; }
  .tile-512 { background: #edc850; color: #f9f6f2; font-size: 30px; }
  .tile-1024{ background: #edc53f; color: #f9f6f2; font-size: 24px; }
  .tile-2048{ background: #edc22e; color: #f9f6f2; font-size: 24px; }
  .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 20px; }

  .tile-new { animation: pop .18s; }
  @keyframes pop {
    0%   { transform: scale(0); }
    100% { transform: scale(1); }
  }

  /* feaure001: 数字动物化展示 —— 动物 emoji 为主体 */
  .tile {
    line-height: 1;
  }
  .tile .animal {
    font-size: 40px;
    line-height: 1;
    display: block;
  }
  .tile-128 .animal, .tile-256 .animal, .tile-512 .animal { font-size: 34px; }
  .tile-1024 .animal, .tile-2048 .animal, .tile-super .animal { font-size: 28px; }
  .tile.tiny .animal { font-size: 24px !important; }

  .footer { margin-top: 20px; font-size: 12px; color: #a99c8c; text-align: center; line-height: 1.6; }

  @media (max-width: 480px) {
    .title { font-size: 36px; }
    .tile-2, .tile-4, .tile-8, .tile-16, .tile-32, .tile-64 { font-size: 28px; }
    .tile-128, .tile-256, .tile-512 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <small>得分</small>
        <span id="score">0</span>
      </div>
      <div class="score-box">
        <small>最高</small>
        <span id="best">0</span>
      </div>
    </div>
  </div>

  <div class="subhead">
    <span class="hint">合并动物，进化成更强大的神兽！</span>
    <button class="btn" id="restartBtn">新游戏</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">游戏结束</h2>
      <p id="overlayText"></p>
      <button class="btn" id="againBtn">再来一次</button>
    </div>
  </div>

  <div class="footer">
    动物版 2048 v1.0.1 | 单页应用 · 无需联网<br>
    目标：合并出神龙 · 2048
  </div>
</div>

<script>
(function () {
  'use strict';

  const SIZE = 4;
  const GRID_GAP = 12;
  const WIN_VALUE = 2048;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlayEl = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const restartBtn = document.getElementById('restartBtn');
  const againBtn = document.getElementById('againBtn');

  let grid = [];      // 4x4 二维数组，存数值
  let score = 0;
  let best = parseInt(localStorage.getItem('2048-best') || '0', 10);
  let wonMerged = false;
  let gameOver = false;

  // ---------- 构建空棋盘 ----------
  function buildCellGrid() {
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        boardEl.appendChild(cell);
      }
    }
  }

  // ---------- 渲染数字块（position absolute 叠加在 cell 上） ----------
  function renderTiles() {
    // 移除旧的 tile
    document.querySelectorAll('.tile').forEach(t => t.remove());

    const boardRect = boardEl.getBoundingClientRect();
    const tileSize = (boardRect.width - GRID_GAP * (SIZE + 1)) / SIZE;

    grid.forEach((row, r) => {
      row.forEach((val, c) => {
        if (val === 0) return;
        const tile = document.createElement('div');
        tile.className = 'tile ' + tileClass(val);
        if (val >= 1000) tile.classList.add('tiny');

        // feaure001: 动物为主展示
        const animal = animalFor(val);
        const anim = document.createElement('span');
        anim.className = 'animal';
        anim.textContent = animal.emoji;
        anim.title = animal.name;
        tile.appendChild(anim);

        const left = GRID_GAP + c * (tileSize + GRID_GAP);
        const top = GRID_GAP + r * (tileSize + GRID_GAP);
        tile.style.left = left + 'px';
        tile.style.top = top + 'px';

        boardEl.appendChild(tile);
      });
    });
  }

  function tileClass(val) {
    if (val <= 2048) return 'tile-' + val;
    return 'tile-super';
  }

  // feaure001: 数字→动物 映射（数值越大，动物越稀有/强大）
  const ANIMAL_MAP = {
    2:    { emoji: '🐁', name: '小鼠' },
    4:    { emoji: '🐹', name: '仓鼠' },
    8:    { emoji: '🐰', name: '兔子' },
    16:   { emoji: '🐱', name: '小猫' },
    32:   { emoji: '🐶', name: '小狗' },
    64:   { emoji: '🐺', name: '狼' },
    128:  { emoji: '🦊', name: '狐狸' },
    256:  { emoji: '🐻', name: '熊' },
    512:  { emoji: '🦁', name: '狮子' },
    1024: { emoji: '🐯', name: '老虎' },
    2048: { emoji: '🐲', name: '神龙' }
  };

  function animalFor(val) {
    if (ANIMAL_MAP[val]) return ANIMAL_MAP[val];
    return { emoji: '🐉', name: '神兽' };
  }

  // ---------- 核心逻辑 ----------
  function emptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) cells.push([r, c]);
    return cells;
  }

  function addRandomTile() {
    const cells = emptyCells();
    if (cells.length === 0) return;
    const [r, c] = cells[Math.floor(Math.random() * cells.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  // 对一行/一列做左移合并，返回 { line, moved, gained }
  function slideLine(line) {
    const nonZero = line.filter(v => v !== 0);
    const result = [];
    let gained = 0;
    for (let i = 0; i < nonZero.length; i++) {
      if (i + 1 < nonZero.length && nonZero[i] === nonZero[i + 1]) {
        const merged = nonZero[i] * 2;
        result.push(merged);
        gained += merged;
        if (merged === WIN_VALUE) wonMerged = true;
        i++; // 跳过被合并的下一个
      } else {
        result.push(nonZero[i]);
      }
    }
    while (result.length < SIZE) result.push(0);
    const moved = result.some((v, i) => v !== line[i]);
    return { line: result, moved, gained };
  }

  // 从某方向抽取行/列，做滑动合并，再放回
  function processDirection(dir) {
    let totalGained = 0;
    let anyMoved = false;

    for (let i = 0; i < SIZE; i++) {
      let line;
      if (dir === 'left')  line = grid[i].slice();
      if (dir === 'right') line = grid[i].slice().reverse();
      if (dir === 'up')    line = grid.map(row => row[i]);
      if (dir === 'down')  line = grid.map(row => row[i]).reverse();

      const res = slideLine(line);

      if (res.moved) anyMoved = true;
      totalGained += res.gained;

      // 写回
      for (let j = 0; j < SIZE; j++) {
        const value = res.line[j];
        if (dir === 'left')  grid[i][j] = value;
        if (dir === 'right') grid[i][SIZE - 1 - j] = value;
        if (dir === 'up')    grid[j][i] = value;
        if (dir === 'down')  grid[SIZE - 1 - j][i] = value;
      }
    }

    return { anyMoved, totalGained };
  }

  function move(dir) {
    if (gameOver) return;
    const { anyMoved, totalGained } = processDirection(dir);
    if (!anyMoved) return;

    score += totalGained;
    updateScores();

    addRandomTile();
    renderTiles();

    if (wonMerged) {
      showOverlay('神龙现世！', '你合并出了 2048\n继续玩可以召唤更多神兽', false);
    } else if (isGameOver()) {
      gameOver = true;
      showOverlay('游戏结束', '没有可用的移动了', true);
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return true;
        if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return true;
      }
    }
    return false;
  }

  function isGameOver() {
    return !canMove();
  }

  // ---------- UI ----------
  function updateScores() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('2048-best', best);
    }
    bestEl.textContent = best;
  }

  function showOverlay(title, text, isFinal) {
    overlayTitle.textContent = title;
    overlayTitle.style.color = isFinal ? '#776e65' : '#60b100';
    overlayText.textContent = text;
    overlayEl.classList.add('show');
  }

  function hideOverlay() {
    overlayEl.classList.remove('show');
  }

  function newGame() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    wonMerged = false;
    gameOver = false;
    buildCellGrid();
    addRandomTile();
    addRandomTile();
    renderTiles();
    updateScores();
    hideOverlay();
  }

  // ---------- 键盘 ----------
  const keyMap = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };
  document.addEventListener('keydown', (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  });

  // ---------- 触控/滑鼠滑动 ----------
  let touchStart = null;
  boardEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  boardEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);
    if (Math.max(absX, absY) < 20) { touchStart = null; return; }

    let dir;
    if (absX > absY) dir = dx > 0 ? 'right' : 'left';
    else dir = dy > 0 ? 'down' : 'up';
    touchStart = null;
    move(dir);
  }, { passive: true });

  // 鼠标滑动垫（可选）
  let mouseStart = null;
  boardEl.addEventListener('mousedown', (e) => {
    mouseStart = { x: e.clientX, y: e.clientY };
  });
  document.addEventListener('mouseup', (e) => {
    if (!mouseStart) return;
    const dx = e.clientX - mouseStart.x;
    const dy = e.clientY - mouseStart.y;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);
    if (Math.max(absX, absY) >= 20) {
      let dir;
      if (absX > absY) dir = dx > 0 ? 'right' : 'left';
      else dir = dy > 0 ? 'down' : 'up';
      move(dir);
    }
    mouseStart = null;
  });

  // ---------- 事件绑定 ----------
  restartBtn.addEventListener('click', newGame);
  againBtn.addEventListener('click', newGame);

  // 浏览器窗口变化时重新定位 tile
  window.addEventListener('resize', renderTiles);
  // 移动端安全区变化等
  if ('visualViewport' in window) {
    window.visualViewport.addEventListener('resize', renderTiles);
  }

  // ---------- 启动 ----------
  bestEl.textContent = best;
  newGame();
})();
</script>
</body>
</html>
